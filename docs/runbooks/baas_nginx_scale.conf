upstream baas_backends {
    server baas-portal:5004;
}

server {
    listen 80;
    location / {
        proxy_pass http://baas_backends;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /health {
        proxy_pass http://baas_backends/health;
    }
}
