{% include "_release_steps.html" %}
<section class="delivery-app download-center-app" data-delivery-page="download-center" data-project-id="{{ project_id }}">
  <div class="pm-page-head">
    <div class="pm-page-head-copy">
      <span class="pm-page-head-icon"><img src="/static/project_ui/svg/nav_download_center.svg" alt=""></span>
      <div>
        <h1>下载中心</h1>
        <p>本项目的安装包和商店入口。按环境、渠道、平台筛选。有包给出下载和二维码，没有包给出商店链接和二维码。</p>
      </div>
    </div>
    <button class="pm-page-star" type="button" aria-label="收藏页面"><img src="/static/project_ui/svg/action_favorite.svg" alt=""></button>
  </div>
  <div class="pm-filter-bar">
    <label class="pm-filter-search"><img src="/static/project_ui/svg/global_search.svg" alt=""><input type="search" data-dc-search placeholder="搜索版本、渠道、说明"></label>
    <select data-dc-env><option value="">全部环境</option><option value="development">开发</option><option value="testing">测试</option><option value="staging">预发</option><option value="production">生产</option><option value="canary">灰度</option></select>
    <select data-dc-channel><option value="">全部渠道</option></select>
    <select data-dc-platform><option value="">全部平台</option><option value="android">Android</option><option value="ios">iOS</option><option value="wechat_minigame">微信小游戏</option></select>
    <button class="pm-btn" type="button" data-dc-refresh><img src="/static/project_ui/svg/action_refresh.svg" alt="">刷新</button>
  </div>
  <div class="dc-grid" data-dc-rows></div>
  <div class="pm-table-pagination"><span data-dc-count>共 0 条</span></div>
  <div class="dc-dialog" data-dc-dialog hidden>
    <div class="dc-dialog-card" role="dialog" aria-modal="true" aria-label="版本详情">
      <header><strong>版本详情</strong><button type="button" data-dc-close>关闭</button></header>
      <div class="dc-detail" data-dc-detail-body></div>
    </div>
  </div>
</section>
<style>
.download-center-app .pm-page-head-copy p{margin:4px 0 0;color:#667085;font-size:13px}
.download-center-app .dc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.download-center-app .dc-card{background:#fff;border:1px solid #e5eaf3;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.download-center-app .dc-card header{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.download-center-app .dc-card header strong{font-size:14px;color:#1d2939}
.download-center-app .dc-card p{margin:0;color:#667085;font-size:12px}
.download-center-app .dc-mark{font-size:11px;padding:2px 8px;border-radius:999px;background:#f2f4f7;color:#475467;white-space:nowrap}
.download-center-app .dc-mark[data-mark="released"]{background:#ecfdf3;color:#027a48}
.download-center-app .dc-mark[data-mark="unreleased"]{background:#eff8ff;color:#175cd3}
.download-center-app .dc-mark[data-mark="rolled_back"]{background:#fef0c7;color:#b54708}
.download-center-app .dc-entry{display:flex;align-items:center;gap:10px;text-decoration:none;color:#175cd3;font-size:13px}
.download-center-app .dc-entry img{width:72px;height:72px;border:1px solid #e5eaf3;border-radius:8px;background:#fff}
.download-center-app .dc-entry.is-empty{color:#98a2b3}
.download-center-app .dc-empty{margin:0;padding:28px;text-align:center;color:#98a2b3;background:#fff;border:1px solid #e5eaf3;border-radius:12px}
.download-center-app .dc-dialog{position:fixed;inset:0;background:rgba(16,24,40,.45);display:grid;place-items:center;z-index:40}
.download-center-app .dc-dialog[hidden]{display:none}
.download-center-app .dc-dialog-card{width:min(480px,calc(100% - 32px));background:#fff;border-radius:12px;padding:16px}
.download-center-app .dc-dialog-card header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.download-center-app .dc-dialog-card header button{border:1px solid #d0d5dd;background:#fff;border-radius:8px;padding:4px 10px;cursor:pointer}
.download-center-app .dc-detail{display:grid;gap:8px}
.download-center-app .dc-detail div{display:grid;gap:2px}
.download-center-app .dc-detail span{font-size:12px;color:#667085}
.download-center-app .dc-detail strong{font-size:13px;color:#1d2939;font-weight:600}
</style>
<script src="/static/project_download_center.js?v=20261028-download-catalog"></script>
