<section class="project-ops-page project-ops-mount ops-page" data-project-id="{{ project_id }}" data-env-key="{{ env_key }}">
  <header class="project-ops-head"><div class="project-ops-head-copy"><span class="project-ops-head-icon"><img src="/static/project_ui/svg/nav_change_governance.svg" alt=""></span><div><h1>变更治理</h1><p>统一管理高风险动作审批、变更窗口、冻结策略与治理事件。</p></div></div><div class="project-ops-actions"><a class="project-ops-btn" href="/admin/projects/{{ project_id }}/actions?env_key={{ env_key }}"><img src="/static/project_ui/svg/nav_execute.svg" alt="">运行执行</a><a class="project-ops-btn" href="/admin/projects/{{ project_id }}/diagnostics?env_key={{ env_key }}"><img src="/static/project_ui/svg/nav_performance.svg" alt="">节点诊断</a><button id="btnRefreshGov" class="project-ops-btn primary" type="button"><img src="/static/project_ui/svg/action_refresh.svg" alt="">刷新</button></div></header>

  <section class="project-ops-panel"><div class="project-ops-panel-head"><div><h2>最近治理事件</h2><p>审批、冻结、发布与运维动作审计记录。</p></div></div><div class="project-ops-panel-body"><div id="govEvents"></div></div></section>
  <input type="hidden" id="govTopologyId" value=""><input type="hidden" id="govEnvKey" value="{{ env_key }}">
</section>
