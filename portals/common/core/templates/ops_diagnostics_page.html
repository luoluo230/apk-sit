<link rel="stylesheet" href="/static/project_ops_workspace.css?v=20260613-1">
<section class="project-ops-page project-ops-mount diag-page" data-project-id="{{ project_id }}" data-env-key="{{ env_key }}">
  <header class="project-ops-head"><div class="project-ops-head-copy"><span class="project-ops-head-icon"><img src="/static/project_ui/svg/nav_performance.svg" alt=""></span><div><h1>节点诊断</h1><p>按当前项目环境汇总节点健康状态、异常证据和处置入口。</p></div></div><div class="project-ops-actions"><a class="project-ops-btn" href="/admin/projects/{{ project_id }}/actions?env_key={{ env_key }}"><img src="/static/project_ui/svg/nav_execute.svg" alt="">运行执行</a><button id="btnRefreshDiag" class="project-ops-btn primary" type="button"><img src="/static/project_ui/svg/action_refresh.svg" alt="">刷新诊断</button></div></header>
  <section class="project-ops-panel"><div class="project-ops-panel-head"><div><h2>诊断概览</h2><p>数据来自当前运行态与节点探针。</p></div></div><div class="project-ops-panel-body"><div id="diagMetrics" class="metric"></div></div></section>
  <section class="project-ops-panel"><div class="project-ops-panel-head"><div><h2>诊断明细</h2><p>筛选异常节点并导出真实诊断数据。</p></div><button id="btnExportDiag" class="project-ops-btn" type="button"><img src="/static/project_ui/svg/action_export.svg" alt="">导出 CSV</button></div><div class="project-ops-panel-body"><div class="project-ops-toolbar filters"><input id="fNode" class="project-ops-input" placeholder="搜索节点 ID"><select id="fRole" class="project-ops-select"><option value="">全部角色</option></select><select id="fStatus" class="project-ops-select"><option value="">全部状态</option><option value="ONLINE">在线</option><option value="DEGRADED">异常</option><option value="OFFLINE">离线</option><option value="UNKNOWN">未知</option></select><button id="btnApplyFilter" class="project-ops-btn primary" type="button">应用筛选</button></div><div id="diagTableWrap" style="margin-top:12px"></div></div></section>
</section>
<script src="/static/ops_platform_api.js?v=20260613-project-v2"></script><script src="/static/ops_platform_diagnostics.js?v=20260613-project-v2"></script>
