<link rel="stylesheet" href="/static/project_versions_workspace.css?v=20260708-versions-v21">
<section class="version-workspace" data-project-id="{{ project_id }}" data-env-key="{{ env_key }}" data-can-edit="{{ 'true' if can_edit else 'false' }}" data-env-scoped="true"{% if platform_filter %} data-platform-filter="{{ platform_filter }}"{% endif %}{% if channel_filter %} data-channel-filter="{{ channel_filter }}"{% endif %}>
  <header class="version-head pm-page-head">
    <div class="pm-page-head-copy">
      <span class="pm-page-head-icon"><img src="/static/project_ui/svg/nav_version_code.svg" alt=""></span>
      <div><h1>版本管理</h1><p class="version-head-sub">从项目卡片进入：创建版本、编辑发版信息，并在列表中执行构建/发布/回滚等操作</p></div>
    </div>
    <div class="version-head-actions pm-page-head-actions">
      <button class="pm-page-star" type="button" aria-label="收藏页面"><img src="/static/project_ui/svg/action_favorite.svg" alt=""></button>
      <button id="btnExportVersions" class="version-btn pm-btn" type="button"><img src="/static/project_ui/svg/action_export.svg" alt="">导出</button>
      <a class="version-btn pm-btn" id="versionBuildHistoryLink" href="/admin/projects/{{ project_id }}/build-history?env_key={{ env_key }}&scoped=1&channel_id={{ channel_filter }}{% if platform_filter %}&platform={{ platform_filter }}{% endif %}"><img src="/static/project_ui/svg/nav_build_artifact.svg" alt="">构建与产物</a>
      {% if can_edit %}
      <button id="btnCreateVersionGroup" class="version-btn pm-btn" type="button"><img src="/static/project_ui/svg/action_add.svg" alt="">新建版本组</button>
      <button id="btnCreateVersionCode" class="version-btn pm-btn pm-btn--primary" type="button"><img src="/static/project_ui/svg/action_add.svg" alt="">创建版本</button>
      {% endif %}
    </div>
  </header>
  <div class="version-scope-actions version-scope-actions--inline" id="versionScopeBanner">
    <a class="version-btn pm-btn neutral" href="/admin/projects">返回项目列表</a>
  </div>
  <div id="versionPlatformTabs" class="version-platform-tabs is-hidden" role="tablist" aria-label="平台"></div>
  <section class="version-panel pm-table-panel">
    <div class="version-toolbar pm-filter-bar">
      <label class="version-search pm-filter-search"><img src="/static/project_ui/svg/global_search.svg" alt=""><input id="versionSearch" type="search" placeholder="搜索版本号 / VersionCode"></label>
      <select id="versionEnv" aria-label="环境"><option value="">全部环境</option><option value="development">开发环境</option><option value="testing">测试环境</option><option value="staging">预发环境</option><option value="production">生产环境</option></select>
      <select id="versionChannel" aria-label="渠道"><option value="">全部渠道</option></select>
      <select id="versionStatus"><option value="">全部状态</option><option value="active">有效</option><option value="testing">测试中</option><option value="draft">草稿</option><option value="disabled">失效</option><option value="archived">归档</option></select>
      <select id="versionArtifactStatus"><option value="">全部产物</option><option value="ready">产物完整</option><option value="pending">产物缺失</option></select>
      <button id="btnResetVersionFilters" class="version-btn pm-btn" type="button">重置</button>
      <button id="btnRefreshVersions" class="version-btn pm-btn" type="button"><img src="/static/project_ui/svg/action_refresh.svg" alt="">刷新</button>
    </div>
    <div class="version-table-head pm-table-cols-7"><span>版本组 / VersionCode</span><span>版本名</span><span>状态</span><span>就绪</span><span>最新构建</span><span>更新时间</span><span>操作</span></div>
    <div id="versionGroups" class="version-group-list"><div class="version-empty">正在加载版本数据...</div></div>
    <footer class="pm-table-pagination" id="versionPagination" hidden>
      <span data-version-count>共 0 条</span>
      <nav><button type="button" data-version-prev disabled><img src="/static/project_ui/svg/action_back.svg" alt=""></button><span data-version-page-text>1 / 1</span><button type="button" data-version-next disabled><img src="/static/project_ui/svg/action_next.svg" alt=""></button></nav>
    </footer>
  </section>
</section>
<div id="versionVcDrawer" class="pm-drawer-root is-hidden" aria-hidden="true">
  <div class="pm-drawer-mask" data-vc-drawer-close></div>
  <aside class="pm-drawer pm-drawer--480" role="dialog" aria-labelledby="versionVcDrawerTitle">
    <header class="pm-drawer-head">
      <div><h2 id="versionVcDrawerTitle">VersionCode 详情</h2><p id="versionVcDrawerSubtitle"></p></div>
      <button class="pm-drawer-close" type="button" data-vc-drawer-close aria-label="关闭"><img src="/static/project_ui/svg/action_close.svg" alt=""></button>
    </header>
    <div class="pm-drawer-body" id="versionVcDrawerBody"></div>
    <footer class="pm-drawer-foot" id="versionVcDrawerFoot"></footer>
  </aside>
</div>
<div id="versionGroupDialog" class="version-dialog pm-modal-root is-hidden" aria-hidden="true">
  <form id="versionGroupForm" class="version-dialog-card pm-modal">
    <div class="version-dialog-head pm-modal-head"><div><h2 id="versionGroupDialogTitle">新建版本组</h2><p id="versionGroupDialogHint">版本组可独立创建，用于组织多个 VersionCode。</p></div><button id="btnCloseVersionGroupDialog" type="button" aria-label="关闭"><img src="/static/project_ui/svg/action_close.svg" alt=""></button></div>
    <div class="version-form-grid pm-modal-body">
      <label><span>版本号</span><input name="version_name" id="versionGroupNameInput" placeholder="例如 1.0.0" required></label>
      <label><span>版本模式</span><select name="version_mode"><option value="general">通用版本</option><option value="commercial">商业化版本</option></select></label>
      <label><span>状态</span><select name="status"><option value="active">有效</option><option value="archived">归档</option></select></label>
      <label class="wide"><span>说明</span><textarea name="notes" rows="3" placeholder="版本组说明（对外大版本说明等）"></textarea></label>
      <label class="wide checkbox-row"><input type="checkbox" name="recommended" value="1"><span>标记为推荐版本组</span></label>
    </div>
    <div class="version-dialog-actions pm-modal-foot"><button id="btnCancelVersionGroupDialog" class="version-btn pm-btn" type="button">取消</button><button class="version-btn pm-btn pm-btn--primary" type="submit" id="btnSubmitVersionGroup">创建版本组</button></div>
  </form>
</div>
<div id="versionDialog" class="version-dialog pm-modal-root is-hidden" aria-hidden="true">
  <form id="versionForm" class="version-dialog-card pm-modal pm-modal--720">
    <div class="version-dialog-head pm-modal-head"><div><h2>创建版本</h2><p id="versionDialogHint">选择环境、渠道与平台，创建 VersionCode 并进入发版编辑。</p></div><button id="btnCloseVersionDialog" type="button" aria-label="关闭"><img src="/static/project_ui/svg/action_close.svg" alt=""></button></div>
    <div id="versionFormScope" class="version-form-scope is-hidden"><span>创建范围</span><strong id="versionFormScopeText"></strong></div>
    <div class="version-form-grid pm-modal-body">
      <label><span>版本组</span><select name="version_name" id="versionNameSelect" required></select></label>
      <label><span>VersionCode</span><input name="version_code" placeholder="例如 20260613" required></label>
      <label class="js-scope-field"><span>环境</span><select name="env_key" id="versionFormEnv"><option value="development">开发环境</option><option value="testing">测试环境</option><option value="staging">预发环境</option><option value="production">生产环境</option></select></label>
      <label id="versionFormChannelField"><span>渠道</span><select name="channel_id" id="versionFormChannel" required></select></label>
      <label class="js-scope-field"><span>平台</span><select name="platform" id="versionFormPlatform" required></select></label>
      <label><span>状态</span><select name="version_status"><option value="draft">草稿</option><option value="testing">测试中</option><option value="active">有效</option></select></label>
      <label class="wide"><span>说明</span><textarea name="notes" rows="3" placeholder="本次 VersionCode 的变更说明"></textarea></label>
    </div>
    <div class="version-dialog-actions pm-modal-foot"><button id="btnCancelVersionDialog" class="version-btn pm-btn" type="button">取消</button><button id="btnSubmitVersionCode" class="version-btn pm-btn pm-btn--primary" type="submit">创建并编辑发版</button></div>
  </form>
</div>
<input type="hidden" id="versionEnvHidden" value="{{ env_key }}">
<div id="versionReleaseModal" class="version-dialog pm-modal-root is-hidden" aria-hidden="true">
  <form id="versionReleaseForm" class="version-dialog-card pm-modal pm-modal--960">
    <div class="version-dialog-head pm-modal-head">
      <div><h2 id="versionReleaseTitle">发版编辑</h2><p id="versionReleaseSubtitle"></p></div>
      <button type="button" id="btnCloseVersionReleaseModal" aria-label="关闭"><img src="/static/project_ui/svg/action_close.svg" alt=""></button>
    </div>
    <div class="version-release-tabs" role="tablist">
      <button type="button" class="is-active" data-release-tab="meta">发版信息</button>
      <button type="button" data-release-tab="announce">公告</button>
      <button type="button" data-release-tab="strategy">策略</button>
      <button type="button" data-release-tab="server">服务端</button>
    </div>
    <div class="version-form-grid pm-modal-body">
      <div class="version-release-pane is-active" data-release-pane="meta">
        <label><span>发版类型</span><select name="release_reason_type"><option value="regular">常规发版</option><option value="hotfix">热修复</option><option value="rollback">回滚</option><option value="emergency">紧急发版</option></select></label>
        <label><span>负责人</span><input name="owner" required></label>
        <label><span>发布窗口</span><input name="release_window" placeholder="staging+ 建议填写"></label>
        <label class="wide"><span>对内说明</span><textarea name="release_description" rows="2"></textarea></label>
        <label class="wide"><span>发布原因</span><textarea name="reason" rows="2" required></textarea></label>
      </div>
      <div class="version-release-pane" data-release-pane="announce">
        <label class="wide"><span>公告标题</span><input name="announcement_title"></label>
        <label class="wide"><span>公告正文</span><textarea name="announcement_body" rows="4"></textarea></label>
        <label><span>生效时间</span><input name="announcement_effective_at" type="datetime-local"></label>
        <label class="wide checkbox-row"><input type="checkbox" name="sync_announcement" value="1"><span>发布时同步 GM 公告</span></label>
      </div>
      <div class="version-release-pane" data-release-pane="strategy">
        <label><span>发布策略</span><select name="release_strategy"><option value="full">全量</option><option value="gray">灰度</option></select></label>
        <label><span>灰度比例 %</span><input name="gray_ratio" type="number" min="1" max="100"></label>
        <label class="wide"><span>验证计划</span><textarea name="validation_plan" rows="3"></textarea></label>
        <label class="wide"><span>回滚计划</span><textarea name="rollback_plan" rows="3"></textarea></label>
      </div>
      <div class="version-release-pane" data-release-pane="server">
        <label><span>目标拓扑</span><input name="target_topology_id"></label>
        <label><span>最低服务端版本</span><input name="min_server_version"></label>
        <label class="wide"><span>维护说明</span><input name="server_maintenance_message" placeholder="服务器暂停时展示给玩家的说明"></label>
        <label class="wide checkbox-row"><input type="checkbox" name="deploy_server_with_client" value="1"><span>与客户端同批发布</span></label>
      </div>
    </div>
    <div class="version-dialog-actions pm-modal-foot version-release-foot">
      <span id="versionReleaseStatus" class="version-release-status"></span>
      <button type="button" class="version-btn pm-btn" id="btnReleaseSave">保存</button>
      <button type="button" class="version-btn pm-btn" id="btnReleaseBuild">构建</button>
      <button type="button" class="version-btn pm-btn" id="btnReleasePrecheck">预检</button>
      <button type="button" class="version-btn pm-btn" id="btnReleaseAnnounce">发布公告</button>
      <button type="button" class="version-btn pm-btn" id="btnReleaseServerPause">服务器暂停</button>
      <button type="button" class="version-btn pm-btn pm-btn--primary" id="btnReleasePublish">发布到线上</button>
      <button type="button" class="version-btn pm-btn warn" id="btnReleaseRollback">回滚</button>
    </div>
  </form>
</div>
<script src="/static/delivery_scope.js?v=20260731-versions-hub-v1"></script>
<script src="/static/project_version_release_editor.js?v=20260731-versions-hub-v1"></script>
