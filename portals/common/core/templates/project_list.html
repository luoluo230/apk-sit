<section class="p01-list" data-page="project-list">
  <header class="p01-head">
    <div class="p01-head-main">
      <button class="pm-page-star" type="button" aria-label="收藏页面"><img src="/static/project_ui/svg/action_favorite.svg" alt=""></button>
      <div>
        <h1>项目列表</h1>
        <p class="p01-sub">共 <b id="p01TotalCount">0</b> 个项目</p>
      </div>
    </div>
    <button type="button" class="pm-btn pm-btn--primary" id="p01CreateBtn"><img src="/static/project_ui/svg/action_add.svg" alt="">+ 创建项目</button>
  </header>

  <div class="p01-filters pm-filter-bar">
    <label class="pm-filter-search">
      <img src="/static/project_ui/svg/global_search.svg" alt="">
      <input type="search" id="p01Search" placeholder="搜索项目名称、负责人、描述、标签…" autocomplete="off">
    </label>
    <select id="p01FilterStatus" aria-label="状态">
      <option value="">状态：全部</option>
      <option value="active">状态：仅活跃</option>
      <option value="archived">状态：已归档</option>
    </select>
    <select id="p01FilterOwner" aria-label="负责人">
      <option value="">负责人：全部</option>
    </select>
    <select id="p01FilterHealth" aria-label="健康状态">
      <option value="">健康状态：全部</option>
      <option value="healthy">健康状态：运行中</option>
      <option value="warning">健康状态：风险中</option>
      <option value="blocked">健康状态：阻塞中</option>
      <option value="archived">健康状态：已归档</option>
    </select>
    <div class="p01-view-toggle" role="group" aria-label="视图切换">
      <button type="button" class="p01-view-btn active" data-view="card" title="卡片视图" aria-label="卡片视图"><img src="/static/project_ui/svg/nav_project_list.svg" alt=""></button>
      <button type="button" class="p01-view-btn" data-view="table" title="表格视图" aria-label="表格视图"><img src="/static/project_ui/svg/view_table.svg" alt=""></button>
    </div>
  </div>

  <div class="p01-layout pm-page-layout">
    <div class="p01-main pm-page-main">
      <section class="p01-list-panel">
        <div class="p01-card-grid" id="p01CardGrid" aria-live="polite"></div>
        <div class="p01-table-panel is-hidden" id="p01TablePanel">
          <div class="p01-table-wrap">
            <table class="p01-table">
              <thead>
                <tr>
                  <th>图标</th>
                  <th>项目ID</th>
                  <th>名称</th>
                  <th>状态</th>
                  <th>负责人</th>
                  <th>环境健康</th>
                  <th>生产版本</th>
                  <th>待审批</th>
                  <th>阻塞项</th>
                  <th>任务</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="p01TableBody"></tbody>
            </table>
          </div>
        </div>
        <footer class="p01-pagination" id="p01Pagination" aria-label="分页"></footer>
      </section>
    </div>
    <aside class="p01-rail pm-page-rail">
      <section class="p01-rail-panel p01-rail-filter is-hidden" id="p01RailFilter">
        <div class="p01-rail-head"><h2>筛选结果</h2><button type="button" class="p01-link-btn" id="p01ClearFilters">清空</button></div>
        <div class="p01-filter-chips" id="p01FilterChips"></div>
        <div class="p01-rail-empty" id="p01RailEmpty">
          <img class="p01-empty-illus" src="/static/project_ui/svg/p01_empty_search.svg" alt="" aria-hidden="true">
          <p>没有符合当前筛选条件的项目</p>
          <button type="button" class="pm-btn" id="p01ResetFilters">重置筛选条件</button>
        </div>
      </section>
      <section class="p01-rail-panel p01-rail-quick">
        <div class="p01-rail-head"><h2>快速操作</h2></div>
        <button type="button" class="p01-quick-item" id="p01QuickCreate"><span class="p01-quick-icon"><img src="/static/project_ui/svg/p01_quick_create.svg" alt=""></span><span class="p01-quick-copy"><span>创建新项目</span><em>从模板创建项目</em></span></button>
        <button type="button" class="p01-quick-item" id="p01QuickImport"><span class="p01-quick-icon"><img src="/static/project_ui/svg/p01_quick_import.svg" alt=""></span><span class="p01-quick-copy"><span>批量导入项目</span><em>从 CSV 导入</em></span></button>
        <button type="button" class="p01-quick-item" id="p01QuickArchive"><span class="p01-quick-icon"><img src="/static/project_ui/svg/p01_quick_archive.svg" alt=""></span><span class="p01-quick-copy"><span>项目归档管理</span><em>查看已归档项目</em></span></button>
      </section>
    </aside>
  </div>
</section>

{% include 'project_list_modals.html' %}

<template id="pmProjectCardTemplate">
  <article class="pm-project-card" data-project-id="">
    <header class="pm-project-card__head">
      <div class="pm-project-card__lead">
        <span class="pm-project-card__icon"><img src="/static/project_ui/svg/nav_project_overview.svg" alt=""></span>
        <div class="pm-project-card__identity">
          <div class="pm-project-card__title-row">
            <h3></h3>
            <span class="pm-project-card__status running">
              <span class="pm-project-card__status-dot"></span>
              <span class="pm-project-card__status-label"></span>
            </span>
          </div>
          <div class="pm-project-card__owner">
            <img src="/static/project_ui/svg/global_user.svg" alt="">
            <span class="pm-project-card__owner-name"></span>
            <time class="pm-project-card__updated"></time>
          </div>
        </div>
      </div>
      <div class="pm-project-card__tools">
        <button type="button" class="pm-project-card__star" aria-label="收藏项目"><img src="/static/project_ui/svg/action_favorite.svg" alt=""></button>
        <button type="button" class="pm-project-card__more" data-card-menu="" aria-label="更多"><img src="/static/project_ui/svg/action_more.svg" alt=""></button>
      </div>
    </header>
    <div class="pm-project-card__metrics">
      <a class="pm-project-card__metric" data-metric="health" href="">
        <span class="pm-project-card__metric-label">环境健康</span>
        <div class="pm-project-card__metric-icon pm-project-card__metric-icon--health"><img src="/static/project_ui/svg/kpi_health.svg" alt=""></div>
        <strong></strong>
        <em></em>
      </a>
      <a class="pm-project-card__metric" data-metric="version" href="">
        <span class="pm-project-card__metric-label">生产版本</span>
        <div class="pm-project-card__metric-icon pm-project-card__metric-icon--version"><img src="/static/project_ui/svg/kpi_version.svg" alt=""></div>
        <strong></strong>
        <em></em>
      </a>
      <a class="pm-project-card__metric" data-metric="pending" href="">
        <span class="pm-project-card__metric-label">待审批</span>
        <div class="pm-project-card__metric-icon pm-project-card__metric-icon--pending"><img src="/static/project_ui/svg/kpi_change.svg" alt=""></div>
        <strong></strong>
        <em></em>
      </a>
      <a class="pm-project-card__metric" data-metric="blockers" href="">
        <span class="pm-project-card__metric-label">阻塞项</span>
        <div class="pm-project-card__metric-icon pm-project-card__metric-icon--blockers"><img src="/static/project_ui/svg/card_kpi_blockers.svg" alt=""></div>
        <strong></strong>
        <em></em>
      </a>
    </div>
    <a class="pm-project-card__release" href=""></a>
    <footer class="pm-project-card__foot">
      <a class="pm-project-card__overview" href=""><span>进入项目总览</span><img src="/static/project_ui/svg/action_next.svg" alt=""></a>
      <button type="button" class="pm-project-card__foot-more" data-card-menu="" aria-label="更多"><img src="/static/project_ui/svg/action_more.svg" alt=""></button>
    </footer>
  </article>
</template>

<script type="application/json" id="p01InitData">{{ init_data_json|safe }}</script>
