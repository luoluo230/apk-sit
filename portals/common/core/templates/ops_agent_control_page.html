<link rel="stylesheet" href="/static/ops_platform_agent_console.css?v=20260605-agent-real-ops-v2">
<div class="agent-screen agent-screen--control" data-project-id="{{ project_id }}" data-page="agent-control">
  <aside class="agent-shell-sidebar">
    <div class="agent-shell-brand">
      <div class="agent-shell-brand-mark">G</div>
      <div class="agent-shell-brand-copy">
        <div class="agent-shell-brand-title">GameOps Console</div>
        <div class="agent-shell-brand-sub">运维平台</div>
      </div>
    </div>

    <nav class="agent-shell-nav">
      <div class="agent-shell-nav-group">
        <a class="agent-shell-nav-item" href="/admin/ops-platform?project_id={{ project_id }}">
          <span class="agent-shell-nav-icon">⌂</span>
          <span>工作台</span>
        </a>
        <a class="agent-shell-nav-item" href="/admin/ops-platform?project_id={{ project_id }}">
          <span class="agent-shell-nav-icon">◫</span>
          <span>总览看板</span>
        </a>
      </div>

      <div class="agent-shell-divider"></div>
      <div class="agent-shell-nav-title">架构编排</div>
      <div class="agent-shell-nav-group">
        <a class="agent-shell-nav-item" href="/admin/ops-platform/topology?project_id={{ project_id }}">
          <span class="agent-shell-nav-icon">◎</span>
          <span>拓扑编排</span>
        </a>
        <a class="agent-shell-nav-item is-active" href="/admin/ops-platform/agent-control?project_id={{ project_id }}">
          <span class="agent-shell-nav-icon">▣</span>
          <span>Agent 与服务器</span>
        </a>
      </div>

      <div class="agent-shell-divider"></div>
      <div class="agent-shell-nav-title">执行与诊断</div>
      <div class="agent-shell-nav-group">
        <a class="agent-shell-nav-item" href="/admin/ops-platform/actions?project_id={{ project_id }}">
          <span class="agent-shell-nav-icon">▷</span>
          <span>动作执行</span>
        </a>
        <a class="agent-shell-nav-item" href="/admin/ops-platform/diagnostics?project_id={{ project_id }}">
          <span class="agent-shell-nav-icon">≈</span>
          <span>节点诊断</span>
        </a>
      </div>

      <div class="agent-shell-divider"></div>
      <div class="agent-shell-nav-title">治理与合规</div>
      <div class="agent-shell-nav-group">
        <a class="agent-shell-nav-item" href="/admin/ops-platform/change-governance?project_id={{ project_id }}">
          <span class="agent-shell-nav-icon">↻</span>
          <span>变更治理</span>
        </a>
        <a class="agent-shell-nav-item" href="/admin/approval">
          <span class="agent-shell-nav-icon">◌</span>
          <span>审批中心</span>
        </a>
      </div>
    </nav>

    <button class="agent-shell-sidebar-toggle" type="button">
      <span class="agent-shell-nav-icon">←</span>
      <span>折叠菜单</span>
    </button>
  </aside>

  <section class="agent-shell-main">
    <header class="agent-shell-topbar">
      <div class="agent-shell-breadcrumb">
        <span>工作台</span>
        <span>/</span>
        <strong>Agent 与服务器</strong>
      </div>
      <div class="agent-shell-topbar-right">
        <button class="agent-shell-icon-btn" type="button" aria-label="通知">◔</button>
        <button class="agent-shell-icon-btn" type="button" aria-label="帮助">?</button>
        <span class="agent-shell-avatar">A</span>
        <span class="agent-shell-user">Admin</span>
        <span class="agent-shell-user-arrow">▾</span>
      </div>
    </header>

    <main class="agent-shell-content">
      <section class="agent-page-hero">
        <div class="agent-page-hero-copy">
          <div class="agent-page-title-line">
            <span class="agent-page-title-badge">G</span>
            <h1>Agent 管控中心</h1>
          </div>
          <p>按设备分组管理 Agent，支持批量操作、状态监控与策略配置</p>
        </div>
        <div class="agent-page-hero-actions">
          <button id="btnCreateAgent" class="agent-btn agent-btn--primary" type="button">新建设备 Agent</button>
          <button id="btnProbeAllAgent" class="agent-btn agent-btn--ghost" type="button">一键探测测试</button>
          <button id="btnProbeRepairAllAgent" class="agent-btn agent-btn--ghost" type="button">批量修复并探测</button>
        </div>
      </section>

      <section id="agentSummaryCards" class="agent-summary-grid"></section>

      <section class="agent-toolbar agent-toolbar--filters">
        <div class="agent-filter-group">
          <select id="filterStatus" class="agent-field agent-field--select">
            <option value="">全部状态</option>
            <option value="ONLINE">在线</option>
            <option value="DEGRADED">异常</option>
            <option value="OFFLINE">离线</option>
          </select>
          <label class="agent-field agent-field--search">
            <input id="filterQuery" type="text" placeholder="按设备 / IP / 备注">
            <span>⌕</span>
          </label>
          <select id="filterServiceStatus" class="agent-field agent-field--select">
            <option value="">全部服务状态</option>
            <option value="healthy">全部正常</option>
            <option value="abnormal">服务异常</option>
            <option value="offline">全部离线</option>
          </select>
          <select id="filterFresh" class="agent-field agent-field--select">
            <option value="active_120" selected>仅看活跃 (120 秒内)</option>
            <option value="all">显示全部</option>
            <option value="active_600">仅看活跃 (10 分钟内)</option>
          </select>
          <button id="btnApplyFilter" class="agent-btn agent-btn--primary agent-btn--small" type="button">应用筛选</button>
          <button id="btnResetFilter" class="agent-btn agent-btn--outline agent-btn--small" type="button">重置</button>
        </div>
        <div class="agent-view-switch">
          <button id="btnCardView" class="agent-view-switch-btn is-active" type="button">卡片视图</button>
          <button id="btnListView" class="agent-view-switch-btn" type="button">列表视图</button>
        </div>
      </section>

      <section class="agent-toolbar agent-toolbar--batch">
        <div class="agent-batch-left">
          <label class="agent-checkbox-line">
            <input id="selectPage" type="checkbox">
            <span id="selectedCountLabel">已选择 0 项</span>
          </label>
          <button id="btnBatchProbe" class="agent-btn agent-btn--outline agent-btn--small" type="button">批量探测</button>
          <button id="btnBatchRestart" class="agent-btn agent-btn--outline agent-btn--small" type="button">批量重启</button>
          <button id="btnBatchBind" class="agent-btn agent-btn--outline agent-btn--small" type="button">批量绑定服务</button>
          <div class="agent-dropdown">
            <button id="btnBatchMore" class="agent-btn agent-btn--outline agent-btn--small" type="button">更多操作 ▾</button>
            <div id="batchMoreMenu" class="agent-dropdown-menu is-hidden">
              <button id="btnClearSelection" type="button">清空选择</button>
              <button id="btnRefreshNow" type="button">立即刷新</button>
            </div>
          </div>
        </div>
        <div class="agent-batch-right">
          <button id="btnCleanupExpired" class="agent-btn agent-btn--outline agent-btn--small" type="button">清理过期 Agent</button>
          <span id="agentRefreshHint">数据自动刷新：每 2 秒同步状态</span>
        </div>
      </section>

      <section class="agent-list-section">
        <div id="agentResultsMeta" class="agent-list-meta"></div>
        <div id="agentCards" class="agent-card-grid"></div>
        <div id="agentList" class="agent-table-shell is-hidden"></div>
        <div class="agent-pagination">
          <div id="agentPaginationMeta" class="agent-pagination-total">共 0 条</div>
          <div class="agent-pagination-center">
            <button id="btnPrevPage" class="agent-pagination-btn" type="button">‹</button>
            <span id="pageIndicator" class="agent-pagination-current">1</span>
            <button id="btnNextPage" class="agent-pagination-btn" type="button">›</button>
          </div>
          <select id="pageSizeSelect" class="agent-page-size">
            <option value="6" selected>每页 6 条</option>
            <option value="9">每页 9 条</option>
            <option value="12">每页 12 条</option>
          </select>
        </div>
      </section>
    </main>
  </section>

  <div id="agentEditModal" class="agent-modal is-hidden" aria-hidden="true">
    <div class="agent-modal-card">
      <div class="agent-modal-head">
        <h3 id="agentEditTitle">编辑 Agent</h3>
        <button id="btnCloseAgentEdit" class="agent-btn agent-btn--outline agent-btn--small" type="button">关闭</button>
      </div>
      <p class="agent-modal-sub">保存后会同步更新当前列表与详情页展示。</p>
      <div class="agent-form-grid">
        <label><span>Agent ID</span><input id="editAgentId" type="text"></label>
        <label><span>设备 ID</span><input id="editDeviceId" type="text"></label>
        <label><span>IP 地址</span><input id="editHostIp" type="text"></label>
        <label><span>显示名称</span><input id="editDisplayName" type="text"></label>
        <label><span>Agent 端口</span><input id="editPort" type="number" min="1" max="65535"></label>
        <label>
          <span>运行状态</span>
          <select id="editRunState">
            <option value="">保持不变</option>
            <option value="ONLINE">ONLINE</option>
            <option value="DEGRADED">DEGRADED</option>
            <option value="OFFLINE">OFFLINE</option>
          </select>
        </label>
        <label class="agent-form-grid-wide"><span>备注</span><textarea id="editDesc" rows="3"></textarea></label>
      </div>
      <div class="agent-modal-actions">
        <button id="btnProbeAgent" class="agent-btn agent-btn--outline" type="button">探测</button>
        <button id="btnSaveAgentEdit" class="agent-btn agent-btn--primary" type="button">保存</button>
        <button id="btnCancelAgentEdit" class="agent-btn agent-btn--ghost" type="button">取消</button>
      </div>
    </div>
  </div>
</div>
<script src="/static/ops_platform_api.js?v=20260605-agent-real-ops-v2"></script>
<script src="/static/ops_platform_agent_control.js?v=20260605-agent-real-ops-v2"></script>
