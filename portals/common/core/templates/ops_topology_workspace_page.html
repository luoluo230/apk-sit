<section class="topology-assets-page" data-project-id="{{ project_id }}" data-env-key="{{ env_key }}">
  <style>
    .topology-assets-page{display:flex;flex-direction:column;gap:16px;color:#173057}
    .ta-card{border:1px solid #dbe5ff;border-radius:18px;background:#fff;box-shadow:0 10px 28px rgba(58,76,122,.07)}
    .ta-pad{padding:18px 20px}.ta-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
    .ta-title{font-size:22px;font-weight:800}.ta-sub{margin-top:5px;font-size:13px;color:#7186aa}
    .ta-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.ta-btn{height:38px;padding:0 14px;border:1px solid #d7e4ff;border-radius:11px;background:#fff;color:#35507a;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:7px;text-decoration:none;cursor:pointer}
    .ta-btn.primary{border-color:#2f6cff;background:linear-gradient(180deg,#3d79ff,#1f61ff);color:#fff;box-shadow:0 9px 20px rgba(47,108,255,.18)}
    .ta-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.ta-kpi{padding:15px 16px;border:1px solid #dbe5ff;border-radius:16px;background:#fff}.ta-kpi span{font-size:12px;color:#7186aa}.ta-kpi strong{display:block;margin-top:5px;font-size:24px}
    .ta-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.ta-filter{height:38px;border:1px solid #d7e4ff;border-radius:11px;background:#fff;padding:0 12px;color:#35507a;font-size:13px}.ta-search{min-width:260px;flex:1}
    .ta-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:15px}.ta-asset{min-width:0;padding:15px;border:1px solid #dbe5ff;border-radius:16px;background:linear-gradient(180deg,#fff,#f8fbff);transition:.18s ease}.ta-asset:hover{transform:translateY(-1px);border-color:#a9c0ff;box-shadow:0 10px 24px rgba(64,105,190,.10)}
    .ta-asset-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.ta-asset-title{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ta-id{margin-top:4px;font-size:11px;color:#8da0c0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ta-status{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}.ta-status:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.ta-status.running,.ta-status.validated{background:#e9fbf1;color:#16a66a}.ta-status.draft{background:#fff6df;color:#d68b00}.ta-status.stopped,.ta-status.archived{background:#fff0f1;color:#e34f61}.ta-status.unknown{background:#eef3fb;color:#7186aa}
    .ta-desc{height:36px;margin-top:11px;font-size:12px;line-height:18px;color:#667fa7;overflow:hidden}.ta-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.ta-tag{padding:4px 7px;border-radius:8px;background:#eef4ff;color:#46658f;font-size:11px;font-weight:700}.ta-tag.default{background:#e9fbf1;color:#168a59}
    .ta-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;padding-top:11px;border-top:1px solid #e9effc}.ta-meta span{display:block;font-size:10px;color:#91a2bf}.ta-meta b{display:block;margin-top:3px;font-size:12px;color:#29466f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ta-row-actions{display:flex;gap:8px;margin-top:13px}.ta-row-actions .ta-btn{height:34px;padding:0 11px;font-size:12px}
    .ta-bindings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}.ta-binding{padding:13px 14px;border:1px solid #dbe5ff;border-radius:14px;background:#f8fbff}.ta-binding strong{font-size:13px}.ta-binding p{margin-top:5px;font-size:12px;color:#7186aa}.ta-empty{grid-column:1/-1;padding:38px 16px;border:1px dashed #cbd9fb;border-radius:15px;background:#fbfdff;text-align:center;color:#8295b7;font-size:13px}
    @media(max-width:1400px){.ta-grid,.ta-bindings{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:900px){.ta-kpis,.ta-grid,.ta-bindings{grid-template-columns:1fr}}
  </style>

  <div class="ta-card ta-pad">
    <div class="ta-head">
      <div><div class="ta-title">项目拓扑资产</div><div class="ta-sub">拓扑资产独立管理；画布编辑通过卡片进入，不再挤占资产列表页面。</div></div>
      <div class="ta-actions">
        <a class="ta-btn" href="/admin/projects/{{ project_id }}/versions?tab=topologyBindings">拓扑绑定矩阵</a>
        <button class="ta-btn primary" id="taCreate" type="button">新建拓扑</button>
      </div>
    </div>
  </div>

  <div class="ta-kpis">
    <div class="ta-kpi"><span>拓扑资产</span><strong id="taCount">--</strong></div>
    <div class="ta-kpi"><span>运行中</span><strong id="taRunning">--</strong></div>
    <div class="ta-kpi"><span>绑定规则</span><strong id="taBindingCount">--</strong></div>
    <div class="ta-kpi"><span>当前环境</span><strong style="font-size:18px">{% if env_key == 'development' %}开发环境{% elif env_key == 'testing' %}测试环境{% elif env_key == 'staging' %}预发布环境{% else %}生产环境{% endif %}</strong></div>
  </div>

  <div class="ta-card ta-pad">
    <div class="ta-head">
      <div><div class="ta-title" style="font-size:16px">拓扑资产列表</div><div class="ta-sub">状态、节点、连线、更新时间与入口集中在小卡片中。</div></div>
      <div class="ta-toolbar">
        <input class="ta-filter ta-search" id="taSearch" placeholder="搜索拓扑名称 / ID">
        <select class="ta-filter" id="taEnv"><option value="">全部环境</option></select>
        <select class="ta-filter" id="taStatus"><option value="">全部状态</option><option value="running">运行中</option><option value="validated">已验证</option><option value="draft">草稿</option><option value="stopped">已停止</option><option value="archived">已归档</option></select>
        <button class="ta-btn" id="taRefresh" type="button">刷新</button>
      </div>
    </div>
    <div class="ta-grid" id="taGrid"><div class="ta-empty">正在加载拓扑资产...</div></div>
  </div>

  <div class="ta-card ta-pad">
    <div class="ta-head">
      <div><div class="ta-title" style="font-size:16px">绑定关系摘要</div><div class="ta-sub">按环境、渠道和大版本展示当前项目已配置的指向关系。</div></div>
      <a class="ta-btn" href="/admin/projects/{{ project_id }}/versions?tab=topologyBindings">管理全部绑定</a>
    </div>
    <div class="ta-bindings" id="taBindings"><div class="ta-empty">正在加载绑定关系...</div></div>
  </div>

  <script>
  (function(){
    var root=document.querySelector('.topology-assets-page'); if(!root)return;
    var projectId=root.dataset.projectId||'', currentEnv=root.dataset.envKey||'production';
    var state={topologies:[],bindings:[],channels:[]};
    var envNames={development:'开发环境',testing:'测试环境',staging:'预发布环境',production:'生产环境'};
    var statusNames={running:'运行中',validated:'已验证',draft:'草稿',stopped:'已停止',archived:'已归档'};
    function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
    function stage(env){return env==='testing'?'test':(env==='development'?'dev':'production')}
    function render(){
      var kw=(document.getElementById('taSearch').value||'').trim().toLowerCase(), env=document.getElementById('taEnv').value, status=document.getElementById('taStatus').value;
      var rows=state.topologies.filter(function(x){return(!kw||[x.name,x.topology_id].join(' ').toLowerCase().includes(kw))&&(!env||x.env_key===env)&&(!status||x.status===status)});
      document.getElementById('taCount').textContent=state.topologies.length;
      document.getElementById('taRunning').textContent=state.topologies.filter(function(x){return x.status==='running'||x.status==='validated'}).length;
      document.getElementById('taBindingCount').textContent=state.bindings.length;
      document.getElementById('taGrid').innerHTML=rows.length?rows.map(function(x){
        var st=x.status||'unknown', canvas='/admin/projects/'+encodeURIComponent(projectId)+'/topologies/canvas?env_key='+encodeURIComponent(x.env_key||currentEnv)+'&topology_id='+encodeURIComponent(x.topology_id||'');
        return '<article class="ta-asset"><div class="ta-asset-top"><div class="min-w-0"><div class="ta-asset-title">'+esc(x.name||x.topology_id)+'</div><div class="ta-id">'+esc(x.topology_id)+'</div></div><span class="ta-status '+esc(st)+'">'+esc(statusNames[st]||st)+'</span></div>'
          +'<div class="ta-desc">'+esc(x.description||'暂无说明')+'</div><div class="ta-tags"><span class="ta-tag">'+esc(envNames[x.env_key]||x.env_key||'-')+'</span>'+(x.is_default?'<span class="ta-tag default">默认拓扑</span>':'')+'</div>'
          +'<div class="ta-meta"><div><span>节点</span><b>'+esc(x.node_count||0)+'</b></div><div><span>连线</span><b>'+esc(x.edge_count||0)+'</b></div><div><span>更新时间</span><b>'+esc(String(x.updated_at||'-').slice(0,10))+'</b></div></div>'
          +'<div class="ta-row-actions"><a class="ta-btn primary" href="'+canvas+'">打开画布</a><a class="ta-btn" href="/admin/projects/'+encodeURIComponent(projectId)+'/versions?stage='+stage(x.env_key)+'&tab=topologyBindings">查看绑定</a></div></article>'
      }).join(''):'<div class="ta-empty">没有匹配的拓扑资产</div>';
    }
    function renderBindings(){
      var cmap={};state.channels.forEach(function(x){cmap[x.channel_id]=x.channel_name||x.channel_key||x.channel_id});
      document.getElementById('taBindings').innerHTML=state.bindings.length?state.bindings.map(function(x){
        var scope=[x.env_key?(envNames[x.env_key]||x.env_key):'全部环境',x.channel_id?(cmap[x.channel_id]||x.channel_id):'全部渠道',x.version_name||'全部大版本'].join(' / ');
        return '<div class="ta-binding"><strong>'+esc(x.level_label||'绑定规则')+'</strong><p>'+esc(scope)+'</p><p>指向：'+esc(x.topology_id||'-')+'</p></div>'
      }).join(''):'<div class="ta-empty">尚未配置拓扑绑定规则</div>';
    }
    function load(){
      Promise.all([
        fetch('/api/ops-platform/topologies?project_id='+encodeURIComponent(projectId),{credentials:'same-origin'}).then(function(r){return r.json()}),
        fetch('/api/ops-platform/topology-bindings?project_id='+encodeURIComponent(projectId),{credentials:'same-origin'}).then(function(r){return r.json()})
      ]).then(function(all){
        state.topologies=all[0].topologies||[];state.bindings=all[1].bindings||[];state.channels=all[1].channels||[];
        var envs=all[0].environments||[];document.getElementById('taEnv').innerHTML='<option value="">全部环境</option>'+envs.map(function(x){return '<option value="'+esc(x.env_key)+'">'+esc(x.label)+'</option>'}).join('');
        render();renderBindings();
      }).catch(function(){document.getElementById('taGrid').innerHTML='<div class="ta-empty">拓扑资产加载失败，请刷新重试</div>'});
    }
    ['taSearch','taEnv','taStatus'].forEach(function(id){document.getElementById(id).addEventListener(id==='taSearch'?'input':'change',render)});
    document.getElementById('taRefresh').addEventListener('click',load);
    document.getElementById('taCreate').addEventListener('click',function(){
      var name=window.prompt('请输入拓扑名称');if(!name)return;
      fetch('/api/ops-platform/topologies/create',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({project_id:projectId,env_key:currentEnv,name:name})}).then(function(r){return r.json()}).then(function(d){if(!d.ok){alert(d.error||'创建失败');return}location.href='/admin/projects/'+encodeURIComponent(projectId)+'/topologies/canvas?env_key='+encodeURIComponent(currentEnv)+'&topology_id='+encodeURIComponent(d.topology_id)});
    });
    load();
  })();
  </script>
</section>
