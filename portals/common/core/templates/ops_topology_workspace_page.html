<section class="ops-workspace-app topology-assets-page" data-project-id="{{ project_id }}" data-env-key="{{ env_key }}">
  <header class="ops-page-head">
    <div class="ops-page-head-main">
      <span class="ops-page-head-icon"><img src="/static/project_ui/svg/nav_topology.svg" alt=""></span>
      <div class="ops-page-head-text"><h1>项目拓扑资产</h1></div>
    </div>
    <div class="ops-page-head-actions">
      <a class="pm-btn pm-btn--compact" href="/admin/projects/{{ project_id }}/environments/{{ env_key }}?open_topology_drawer=1&amp;env_key={{ env_key }}"><img src="/static/project_ui/svg/nav_binding.svg" alt="">拓扑绑定</a>
      <button class="pm-btn pm-btn--primary pm-btn--compact" id="taCreate" type="button"><img src="/static/project_ui/svg/action_add.svg" alt="">新建拓扑</button>
    </div>
  </header>

  <section class="env-panel ops-panel">
    <div class="env-panel-head">
      <h2>拓扑资产</h2>
      <span class="ops-panel-meta" id="taContext"></span>
    </div>
    <div class="ops-filter-bar pm-filter-bar">
      <label class="pm-filter-search"><img src="/static/project_ui/svg/global_search.svg" alt=""><input id="taSearch" type="search" placeholder="搜索名称 / ID"></label>
      <select id="taEnv" aria-label="环境"><option value="">全部环境</option></select>
      <select id="taStatus" aria-label="状态"><option value="">全部状态</option><option value="running">运行中</option><option value="validated">已验证</option><option value="draft">草稿</option><option value="stopped">已停止</option><option value="archived">已归档</option></select>
      <button class="pm-btn pm-btn--compact" id="taRefresh" type="button"><img src="/static/project_ui/svg/action_refresh.svg" alt="">刷新</button>
    </div>
    <div class="env-line-cards-wrap">
      <div class="env-line-cards" id="taGrid"><div class="ops-workspace-empty">正在加载…</div></div>
    </div>
  </section>

  <section class="env-panel ops-panel">
    <div class="env-panel-head">
      <h2>绑定摘要</h2>
      <span class="ops-panel-meta" id="taBindingMeta"></span>
    </div>
    <div class="env-line-cards-wrap">
      <div class="env-line-cards" id="taBindings"><div class="ops-workspace-empty">正在加载…</div></div>
    </div>
  </section>

  <div class="ops-dialog" id="taCreateDialog" hidden>
    <form class="ops-dialog-card" id="taCreateForm">
      <div class="ops-dialog-head">
        <h2>新建拓扑</h2>
        <button class="pm-btn pm-btn--compact" id="taCreateClose" type="button" aria-label="关闭"><img src="/static/project_ui/svg/action_close.svg" alt=""></button>
      </div>
      <div class="ops-dialog-body">
        <label class="ops-dialog-field"><span>名称</span><input name="name" required maxlength="80" placeholder="测试环境灰度拓扑"></label>
        <label class="ops-dialog-field"><span>环境</span><select name="env_key"><option value="development">开发环境</option><option value="testing">测试环境</option><option value="staging">预发环境</option><option value="production">生产环境</option></select></label>
        <label class="ops-dialog-field wide"><span>说明</span><textarea name="description" rows="2" placeholder="可选"></textarea></label>
      </div>
      <div class="ops-dialog-feedback" id="taCreateFeedback"></div>
      <div class="ops-dialog-actions">
        <button class="pm-btn pm-btn--compact" id="taCreateCancel" type="button">取消</button>
        <button class="pm-btn pm-btn--primary pm-btn--compact" type="submit">创建并打开画布</button>
      </div>
    </form>
  </div>

  <script>
  (function(){
    var root=document.querySelector('.topology-assets-page'); if(!root)return;
    var projectId=root.dataset.projectId||'', currentEnv=root.dataset.envKey||'production';
    var state={topologies:[],bindings:[],channels:[]};
    var envNames={development:'开发',testing:'测试',staging:'预发',production:'生产'};
    var statusNames={running:'运行中',validated:'已验证',draft:'草稿',stopped:'已停止',archived:'已归档'};
    function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
    function cardClass(st){return st==='running'||st==='validated'?'configured':(st==='draft'||st==='stopped'?'unconfigured':'neutral')}
    function badgeClass(st){return st==='running'||st==='validated'?'ready':(st==='draft'||st==='stopped'?'pending':'neutral')}
    function bindingDrawerHref(envKey, channelId, platform){
      var ek=envKey||currentEnv||'development';
      var q='open_topology_drawer=1&env_key='+encodeURIComponent(ek);
      if(channelId) q+='&channel_id='+encodeURIComponent(channelId);
      if(platform) q+='&platform='+encodeURIComponent(platform);
      return '/admin/projects/'+encodeURIComponent(projectId)+'/environments/'+encodeURIComponent(ek)+'?'+q;
    }
    function renderContext(){
      var host=document.getElementById('taContext'); if(!host)return;
      var running=state.topologies.filter(function(x){return x.status==='running'||x.status==='validated'}).length;
      host.textContent=state.topologies.length?('共 '+state.topologies.length+' · 运行 '+running):'';
    }
    function renderCard(x){
      var st=x.status||'unknown', cls=cardClass(st), badge=badgeClass(st);
      var canvas='/admin/projects/'+encodeURIComponent(projectId)+'/topologies/canvas?env_key='+encodeURIComponent(x.env_key||currentEnv)+'&topology_id='+encodeURIComponent(x.topology_id||'');
      return '<article class="env-line-card '+cls+'"><div class="env-line-card-head"><span class="env-line-platform-icon"><img src="/static/project_ui/svg/nav_topology.svg" alt=""></span><div class="env-line-card-title"><span class="env-line-platform">'+esc(x.name||x.topology_id)+'</span><span class="env-line-badge '+badge+'">'+esc(statusNames[st]||st)+'</span></div></div>'
        +'<p class="env-line-status-hint" title="'+esc(x.topology_id)+'">'+esc(envNames[x.env_key]||x.env_key||'-')+'</p>'
        +'<dl class="env-line-fields"><div><dt>节点</dt><dd>'+esc(x.node_count||0)+'</dd></div><div><dt>连线</dt><dd>'+esc(x.edge_count||0)+'</dd></div><div><dt>更新</dt><dd>'+esc(String(x.updated_at||'-').slice(0,10))+'</dd></div></dl>'
        +'<footer class="env-line-actions env-line-card-links"><a class="matrix-btn build" href="'+canvas+'">画布</a><a class="matrix-btn version" href="'+bindingDrawerHref(x.env_key||currentEnv,'','')+'">绑定</a></footer></article>';
    }
    function render(){
      var kw=(document.getElementById('taSearch').value||'').trim().toLowerCase(), env=document.getElementById('taEnv').value, status=document.getElementById('taStatus').value;
      var rows=state.topologies.filter(function(x){return(!kw||[x.name,x.topology_id].join(' ').toLowerCase().includes(kw))&&(!env||x.env_key===env)&&(!status||x.status===status)});
      renderContext();
      document.getElementById('taGrid').innerHTML=rows.length?rows.map(renderCard).join(''):'<div class="ops-workspace-empty">无匹配拓扑</div>';
    }
    function renderBindings(){
      var cmap={};state.channels.forEach(function(x){cmap[x.channel_id]=x.channel_name||x.channel_key||x.channel_id});
      var meta=document.getElementById('taBindingMeta');
      if(meta) meta.textContent=state.bindings.length?('共 '+state.bindings.length+' 条'):'';
      document.getElementById('taBindings').innerHTML=state.bindings.length?state.bindings.map(function(x){
        var scope=[x.env_key?(envNames[x.env_key]||x.env_key):'全部',x.channel_id?(cmap[x.channel_id]||x.channel_id):'全部',x.version_name||'全部'].join(' / ');
        return '<article class="env-line-card configured"><div class="env-line-card-head"><span class="env-line-platform-icon"><img src="/static/project_ui/svg/nav_binding.svg" alt=""></span><div class="env-line-card-title"><span class="env-line-platform">'+esc(x.level_label||'绑定')+'</span><span class="env-line-badge ready">绑定</span></div></div>'
          +'<p class="env-line-status-hint" title="'+esc(scope)+'">'+esc(scope)+'</p>'
          +'<dl class="env-line-fields"><div><dt>拓扑</dt><dd class="mono" title="'+esc(x.topology_id||'-')+'">'+esc(x.topology_id||'-')+'</dd></div></dl>'
          +'<footer class="env-line-actions env-line-card-links"><a class="matrix-btn version" href="'+bindingDrawerHref(x.env_key, x.channel_id, x.platform)+'">管理</a></footer></article>';
      }).join(''):'<div class="ops-workspace-empty">暂无绑定</div>';
    }
    function load(){
      Promise.all([
        fetch('/api/projects/'+encodeURIComponent(projectId)+'/topologies',{credentials:'same-origin'}).then(function(r){return r.json()}).then(function(d){return d.data||{}}),
        fetch('/api/projects/'+encodeURIComponent(projectId)+'/topology-bindings',{credentials:'same-origin'}).then(function(r){return r.json()}).then(function(d){return d.data||{}})
      ]).then(function(all){
        state.topologies=all[0].topologies||[];state.bindings=all[1].bindings||[];state.channels=all[1].channels||[];
        var envs=all[0].environments||[];document.getElementById('taEnv').innerHTML='<option value="">全部环境</option>'+envs.map(function(x){return '<option value="'+esc(x.env_key)+'">'+esc(x.label)+'</option>'}).join('');
        render();renderBindings();
      }).catch(function(){document.getElementById('taGrid').innerHTML='<div class="ops-workspace-empty">加载失败</div>'});
    }
    ['taSearch','taEnv','taStatus'].forEach(function(id){document.getElementById(id).addEventListener(id==='taSearch'?'input':'change',render)});
    document.getElementById('taRefresh').addEventListener('click',load);
    var createDialog=document.getElementById('taCreateDialog'),createForm=document.getElementById('taCreateForm'),createFeedback=document.getElementById('taCreateFeedback');
    function closeCreate(){createDialog.hidden=true;createFeedback.textContent='';createForm.reset()}
    document.getElementById('taCreate').addEventListener('click',function(){createDialog.hidden=false;createForm.env_key.value=currentEnv;createForm.name.focus()});
    document.getElementById('taCreateClose').addEventListener('click',closeCreate);
    document.getElementById('taCreateCancel').addEventListener('click',closeCreate);
    createDialog.addEventListener('click',function(event){if(event.target===createDialog)closeCreate()});
    createForm.addEventListener('submit',function(event){
      event.preventDefault();createFeedback.textContent='';
      var payload=Object.fromEntries(new FormData(createForm).entries());
      fetch('/api/projects/'+encodeURIComponent(projectId)+'/topologies',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).then(function(r){return r.json()}).then(function(d){
        if(!d.ok){createFeedback.textContent=d.error||'创建失败';return}
        location.href='/admin/projects/'+encodeURIComponent(projectId)+'/topologies/canvas?env_key='+encodeURIComponent(payload.env_key)+'&topology_id='+encodeURIComponent((d.data||{}).topology_id||'');
      }).catch(function(){createFeedback.textContent='请求失败'});
    });
    load();
  })();
  </script>
</section>
