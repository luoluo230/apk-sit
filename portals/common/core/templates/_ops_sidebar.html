<aside class="ops-shell-nav">
  <a class="ops-shell-brand" href="/admin">
    <img src="/static/project_ui/svg/logo_mark.svg" alt="">
    <div><strong>Dev Portal</strong><span>项目交付管理平台</span></div>
  </a>
  <nav class="ops-shell-nav-tree">
    {% for group in shell_groups(nav_project|default('', true), env_key, active_page, request.path) %}
    <div class="ops-shell-nav-group"><b>{{ group.label }}</b>
      {% for item in group["items"] %}
      <a {% if item.active %}class="active"{% endif %} href="{{ item.href }}">
        <img src="/static/project_ui/svg/{{ item.icon }}.svg" alt=""><span>{{ item.label }}</span>
      </a>
      {% endfor %}
    </div>
    {% endfor %}
  </nav>
  <button class="ops-shell-collapse-btn" type="button"><img src="/static/project_ui/svg/nav_collapse.svg" alt=""><b>收起菜单</b></button>
</aside>
