<section class="delivery-app env-detail-app" data-delivery-page="environment" data-project-id="{{ project_id }}" data-env-key="{{ env_key }}">
  <header class="env-detail-head">
    <div class="env-detail-head-copy">
      <a class="env-detail-back" href="/admin/projects/{{ project_id }}/overview"><img src="/static/project_ui/svg/action_back.svg" alt="">返回项目总览</a>
      <h1 id="envDetailTitle">{{ env_key }}</h1>
    </div>
    <div class="env-detail-head-actions">
      <a class="ui-secondary" href="/admin/projects/{{ project_id }}/environments/{{ env_key }}/runtime"><img src="/static/project_ui/svg/nav_environment.svg" alt="">进入运行工作台</a>
      <button class="ui-icon-btn" data-refresh-env type="button" aria-label="刷新"><img src="/static/project_ui/svg/action_refresh.svg" alt=""></button>
    </div>
  </header>

  <div class="env-detail-layout">
    <main class="env-detail-main">
      <section class="env-panel">
        <div class="env-panel-head"><h2>交付线矩阵</h2><span>env × channel × platform</span></div>
        <div class="env-line-cards-wrap" id="deliveryMatrix"><div class="ui-skeleton">正在加载交付线矩阵...</div></div>
      </section>
      <section class="env-panel env-panel-orders">
        <div class="env-panel-head"><h2>进行中发布单</h2><a class="env-panel-link" href="/admin/projects/{{ project_id }}/versions?env_key={{ env_key }}">版本代码<img src="/static/project_ui/svg/action_next.svg" alt=""></a></div>
        <div class="env-order-list" id="envOrders"><div class="ui-empty">暂无发布单</div></div>
      </section>
    </main>

    <aside class="env-detail-rail">
      <section class="env-rail-card" id="envDeliveryScopePanel">
        <div class="env-rail-head"><h2>本环境交付范围</h2><button type="button" class="env-rail-link-btn" id="btnEditDeliveryScope">管理范围</button></div>
        <p class="env-rail-meta" id="envDeliveryScopeHint">加载中...</p>
        <div id="envDeliveryScopeChips" class="env-scope-chips"></div>
      </section>
      <section class="env-rail-card">
        <div class="env-rail-head"><h2>项目平台</h2><a class="env-rail-link" href="/admin/projects/{{ project_id }}/overview?tab=platforms">管理平台<img src="/static/project_ui/svg/action_next.svg" alt=""></a></div>
        <div id="envPlatformList" class="env-platform-list"><div class="ui-skeleton">加载中...</div></div>
      </section>
      <section class="env-rail-card env-rail-init">
        <div class="env-rail-head"><h2>交付线初始化</h2></div>
        <p class="env-rail-meta" id="manifestStatus">检查 Manifest 状态中...</p>
        <button class="ui-primary env-init-btn" id="btnBootstrapScopes" type="button">初始化交付线 Scope</button>
      </section>
      <section class="env-rail-card">
        <div class="env-rail-head"><h2>配置入口</h2></div>
        <div class="env-quick-grid">
          <a href="/admin/projects/{{ project_id }}/versions?env_key={{ env_key }}"><img src="/static/project_ui/svg/nav_version_code.svg" alt="">版本管理</a>
          <a href="/admin/projects/{{ project_id }}/topologies?env_key={{ env_key }}"><img src="/static/project_ui/svg/nav_topology.svg" alt="">拓扑资产</a>
        </div>
      </section>
    </aside>
  </div>

  <div id="deliveryScopeDialog" class="delivery-dialog is-hidden" aria-hidden="true">
    <div class="delivery-dialog-card delivery-scope-card">
      <div class="delivery-dialog-head">
        <div><h3>配置环境交付范围</h3></div>
        <button type="button" class="icon-button" id="btnCloseDeliveryScope" aria-label="关闭"><img src="/static/project_ui/svg/action_close.svg" alt=""></button>
      </div>
      <div class="scope-editor-grid">
        <div><strong>渠道</strong><div id="deliveryScopeChannels" class="scope-check-list"></div></div>
        <div><strong>平台</strong><div id="deliveryScopePlatforms" class="scope-check-list"></div></div>
      </div>
      <div class="delivery-dialog-actions">
        <button type="button" class="ui-secondary" id="btnCancelDeliveryScope">取消</button>
        <button type="button" class="ui-primary" id="btnSaveDeliveryScope">保存</button>
      </div>
    </div>
  </div>

  <div id="topologyBindingDrawer" class="topology-binding-drawer is-hidden" aria-hidden="true">
    <div class="topology-drawer-backdrop" data-drawer-close></div>
    <aside class="topology-drawer-panel" role="dialog" aria-labelledby="topologyDrawerTitle">
      <header class="topology-drawer-head">
        <div><h3 id="topologyDrawerTitle">拓扑绑定</h3><p id="topologyDrawerPreview">选择目标拓扑并保存绑定</p></div>
        <button type="button" class="icon-button" data-drawer-close aria-label="关闭"><img src="/static/project_ui/svg/action_close.svg" alt=""></button>
      </header>
      <div id="topologyDrawerSummary" class="topology-drawer-summary">加载中…</div>
      <div class="topology-drawer-filters">
        <input id="topologyDrawerSearch" type="search" placeholder="搜索拓扑名称或 ID" aria-label="搜索拓扑">
        <select id="topologyDrawerEnv" aria-label="环境筛选"></select>
        <select id="topologyDrawerStatus" aria-label="状态筛选"></select>
        <label class="topology-drawer-check"><input id="topologyDrawerSameEnv" type="checkbox" checked> 优先本环境</label>
      </div>
      <div id="topologyDrawerList" class="topology-drawer-list"><div class="topology-drawer-empty">加载中…</div></div>
      <footer class="topology-drawer-foot">
        <button type="button" class="ui-secondary" id="topologyDrawerClear">清除覆盖</button>
        <a class="ui-secondary" id="topologyDrawerAssets" href="#">拓扑资产</a>
        <button type="button" class="ui-primary" id="topologyDrawerSave">保存绑定</button>
      </footer>
    </aside>
  </div>
</section>
