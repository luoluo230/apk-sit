<section class="ops-workspace-app binding-page" data-project-id="{{ project_id }}">
  <header class="ops-page-head">
    <div class="ops-page-head-main">
      <span class="ops-page-head-icon"><img src="/static/project_ui/svg/nav_binding.svg" alt=""></span>
      <div class="ops-page-head-text"><h1>拓扑绑定矩阵</h1></div>
    </div>
    <div class="ops-page-head-actions">
      <a class="pm-btn pm-btn--compact" href="/admin/projects/{{ project_id }}/topologies"><img src="/static/project_ui/svg/nav_topology.svg" alt="">拓扑资产</a>
      <button class="pm-btn pm-btn--compact" id="bindingRefresh" type="button"><img src="/static/project_ui/svg/action_refresh.svg" alt="">刷新</button>
    </div>
  </header>

  <section class="env-panel ops-panel">
    <div class="env-panel-head"><h2>新增绑定</h2></div>
    <div class="ops-binding-bar ops-filter-bar pm-filter-bar">
      <select id="bindingLevel" aria-label="绑定层级"><option value="project_default">项目默认</option><option value="env_channel">环境 / 渠道</option><option value="version">大版本覆盖</option></select>
      <select id="bindingEnv" aria-label="环境"></select>
      <select id="bindingChannel" aria-label="渠道"></select>
      <select id="bindingVersionName" aria-label="大版本"></select>
      <select id="bindingTopology" aria-label="目标拓扑"></select>
      <button class="pm-btn pm-btn--primary pm-btn--compact" id="bindingSave" type="button">保存</button>
    </div>
  </section>

  <section class="env-panel ops-panel">
    <div class="env-panel-head"><h2>绑定规则</h2><span class="ops-panel-meta" id="bindingContext"></span></div>
    <div class="env-line-cards-wrap">
      <div class="env-line-cards" id="bindingGrid"><div class="ops-workspace-empty">正在加载…</div></div>
    </div>
  </section>

  <script>
  (function(){
    var root=document.querySelector('.binding-page');if(!root)return;var projectId=root.dataset.projectId,state={bindings:[],topologies:[],channels:[],version_names:[]};
    var envs=[['development','开发环境'],['testing','测试环境'],['staging','预发环境'],['production','生产环境']],esc=function(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')};
    function request(url,opts){return fetch(url,Object.assign({credentials:'same-origin'},opts||{})).then(function(r){return r.json().then(function(d){if(!r.ok||d.ok===false)throw new Error(d.error||'请求失败');return d.data})})}
    function options(rows,value,label,empty){return (empty?'<option value="">'+empty+'</option>':'')+rows.map(function(x){return '<option value="'+esc(x[value])+'">'+esc(x[label])+'</option>'}).join('')}
    function updateControls(){var level=document.getElementById('bindingLevel').value;document.getElementById('bindingEnv').disabled=level==='project_default';document.getElementById('bindingChannel').disabled=level==='project_default';document.getElementById('bindingVersionName').disabled=level!=='version'}
    function renderContext(){
      var host=document.getElementById('bindingContext'); if(!host)return;
      host.textContent=state.bindings.length?('共 '+state.bindings.length+' 条'):'';
    }
    function render(){
      renderContext();
      var cm={};state.channels.forEach(function(x){cm[x.channel_id]=x.channel_name});var tm={};state.topologies.forEach(function(x){tm[x.topology_id]=x.name||x.topology_id});var em={};envs.forEach(function(x){em[x[0]]=x[1]});
      document.getElementById('bindingGrid').innerHTML=state.bindings.length?state.bindings.map(function(x){
        return '<article class="env-line-card configured" data-binding-id="'+esc(x.binding_id)+'"><div class="env-line-card-head"><span class="env-line-platform-icon"><img src="/static/project_ui/svg/nav_binding.svg" alt=""></span><div class="env-line-card-title"><span class="env-line-platform">'+esc(tm[x.topology_id]||x.topology_id)+'</span><span class="env-line-badge ready">'+esc(x.level_label||'绑定')+'</span></div></div>'
          +'<p class="env-line-status-hint">'+esc(em[x.env_key]||'全部')+' / '+esc(cm[x.channel_id]||'全部')+' / '+esc(x.version_name||'全部')+'</p>'
          +'<footer class="env-line-actions env-line-card-links"><button class="matrix-btn warn" type="button" data-delete="'+esc(x.binding_id)+'">删除</button></footer></article>';
      }).join(''):'<div class="ops-workspace-empty">暂无绑定</div>';
      document.querySelectorAll('[data-delete]').forEach(function(btn){btn.addEventListener('click',function(){if(!confirm('确认删除？'))return;request('/api/projects/'+encodeURIComponent(projectId)+'/topology-bindings/'+encodeURIComponent(btn.dataset.delete),{method:'DELETE'}).then(load).catch(function(e){alert(e.message)})})})
    }
    function load(){request('/api/projects/'+encodeURIComponent(projectId)+'/topology-bindings').then(function(data){state=data;document.getElementById('bindingEnv').innerHTML=options(envs,0,1);document.getElementById('bindingChannel').innerHTML=options(state.channels,'channel_id','channel_name');document.getElementById('bindingVersionName').innerHTML=options(state.version_names.map(function(x){return{value:x,label:x}}),'value','label');document.getElementById('bindingTopology').innerHTML=options(state.topologies,'topology_id','name');updateControls();render()}).catch(function(e){document.getElementById('bindingGrid').innerHTML='<div class="ops-workspace-empty">'+esc(e.message)+'</div>'})}
    document.getElementById('bindingLevel').addEventListener('change',updateControls);document.getElementById('bindingRefresh').addEventListener('click',load);document.getElementById('bindingSave').addEventListener('click',function(){var level=document.getElementById('bindingLevel').value,payload={topology_id:document.getElementById('bindingTopology').value,env_key:level==='project_default'?'':document.getElementById('bindingEnv').value,channel_id:level==='project_default'?'':document.getElementById('bindingChannel').value,version_name:level==='version'?document.getElementById('bindingVersionName').value:''};request('/api/projects/'+encodeURIComponent(projectId)+'/topology-bindings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).then(load).catch(function(e){alert(e.message)})});load();
  })();
  </script>
</section>
