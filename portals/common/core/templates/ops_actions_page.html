<link rel="stylesheet" href="/static/project_ops_workspace.css?v=20260717-workspace-v5">
<section class="project-ops-page project-ops-mount ops-page ops-actions-app ops-workspace-app" data-project-id="{{ project_id }}" data-env-key="{{ env_key }}">
  <header class="ops-page-head">
    <div class="ops-page-head-main">
      <span class="ops-page-head-icon"><img src="/static/project_ui/svg/nav_execute.svg" alt=""></span>
      <div class="ops-page-head-text"><h1>运行执行中心</h1></div>
    </div>
    <div class="ops-page-head-actions">
      <a class="pm-btn pm-btn--compact" href="/admin/projects/{{ project_id }}/agents?env_key={{ env_key }}"><img src="/static/project_ui/svg/nav_agent_server.svg" alt="">Agent</a>
      <a class="pm-btn pm-btn--compact" href="/admin/projects/{{ project_id }}/change-governance?env_key={{ env_key }}"><img src="/static/project_ui/svg/nav_change_governance.svg" alt="">变更治理</a>
    </div>
  </header>

  <div class="project-ops-grid">
    <section class="project-ops-panel env-panel">
      <div class="project-ops-panel-head env-panel-head"><h2>创建动作</h2></div>
      <div class="project-ops-panel-body">
        <div class="project-ops-form">
          <label class="project-ops-field"><span>目标类型</span><select id="actTargetType"><option value="" selected>全部</option><option value="service">服务</option><option value="topology">拓扑</option><option value="agent">Agent</option><option value="node">节点</option></select></label>
          <label class="project-ops-field"><span>动作目标</span><select id="actTargetKey"></select></label>
          <div id="actTargetMeta" class="project-ops-note project-ops-field wide is-hidden"></div>
          <label class="project-ops-field"><span>动作类型</span><select id="actType"></select></label>
          <label class="project-ops-field"><span>目标 ID</span><input id="actTarget"></label>
          <label class="project-ops-field"><span>变更单</span><input id="actTicket" placeholder="OPS-20260613"></label>
          <label class="project-ops-field"><span>审批人</span><input id="actApprover"></label>
          <label class="project-ops-field wide"><span>原因</span><textarea id="actReason" rows="2"></textarea></label>
          <div class="project-ops-form-actions">
            <button id="btnValidate" class="pm-btn pm-btn--compact" type="button">预校验</button>
            <button id="btnCreateApproval" class="pm-btn pm-btn--compact" type="button">审批</button>
            <button id="btnExecute" class="pm-btn pm-btn--primary pm-btn--compact" type="button">执行</button>
          </div>
        </div>
      </div>
    </section>

    <section class="project-ops-panel env-panel">
      <div class="project-ops-panel-head env-panel-head"><h2>执行结果</h2></div>
      <div class="project-ops-panel-body">
        <div id="execMeta" class="project-ops-note is-hidden"></div>
        <pre id="execOutput" class="project-ops-output"></pre>
        <div id="execEvents"></div>
      </div>
    </section>

    <section class="project-ops-panel env-panel">
      <div class="project-ops-panel-head env-panel-head"><h2>执行策略</h2><button id="btnRefreshPolicy" class="pm-btn pm-btn--compact" type="button">刷新</button></div>
      <div class="project-ops-panel-body"><div class="project-ops-form">
        <label class="project-ops-field"><span>mTLS</span><select id="polMtls"><option value="false">否</option><option value="true">是</option></select></label>
        <label class="project-ops-field"><span>并发</span><input id="polConc" type="number" min="1" max="20"></label>
        <label class="project-ops-field"><span>租约(s)</span><input id="polLease" type="number" min="5" max="3600"></label>
        <label class="project-ops-field"><span>重试</span><input id="polRetry" type="number" min="0" max="10"></label>
        <label class="project-ops-field"><span>灰度</span><select id="polRollEnable"><option value="false">否</option><option value="true">是</option></select></label>
        <label class="project-ops-field"><span>版本</span><input id="polVersion"></label>
        <label class="project-ops-field"><span>通道</span><input id="polChannel" placeholder="stable"></label>
        <label class="project-ops-field"><span>比例%</span><input id="polPercent" type="number" min="0" max="100"></label>
        <label class="project-ops-field wide"><span>白名单</span><input id="polAllowIds" placeholder="逗号分隔"></label>
        <div class="project-ops-form-actions"><button id="btnSavePolicy" class="pm-btn pm-btn--primary pm-btn--compact" type="button">保存</button></div>
      </div></div>
    </section>

    <section class="project-ops-panel env-panel">
      <div class="project-ops-panel-head env-panel-head"><h2>Agent 在线</h2><button id="btnRefreshAgents" class="pm-btn pm-btn--compact" type="button">刷新</button></div>
      <div class="project-ops-panel-body"><div id="agentRegistryWrap" class="ops-agent-registry"></div></div>
    </section>

    <section class="project-ops-panel env-panel wide">
      <div class="project-ops-panel-head env-panel-head">
        <h2>任务队列</h2>
        <div class="project-ops-toolbar">
          <select id="qStatus" class="project-ops-select" aria-label="状态"><option value="">全部</option><option value="PENDING">待执行</option><option value="RUNNING">运行中</option><option value="SUCCESS">成功</option><option value="FAILED">失败</option><option value="CANCELED">取消</option><option value="TIMEOUT">超时</option></select>
          <button id="btnRefreshQueue" class="pm-btn pm-btn--compact" type="button">刷新</button>
        </div>
      </div>
      <div class="project-ops-panel-body">
        <div id="queueSummary" class="project-ops-queue-cards"></div>
        <div id="queueTableWrap" class="ops-queue-grid"></div>
      </div>
    </section>
  </div>
</section>
<script src="/static/ops_platform_api.js?v=20260717-workspace-v5"></script>
<script src="/static/ops_platform_actions.js?v=20260717-workspace-v5"></script>
