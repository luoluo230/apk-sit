<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{{ title }} - Dev Portal</title>
  <link rel="icon" href="/favicon.ico" type="image/svg+xml">
  <link rel="stylesheet" href="/static/project_ui/design-tokens.css?v=20260613-1">
  <link rel="stylesheet" href="/static/ops_shell.css?v=20260623-nav1">
  {% if extra_css %}{{ extra_css|safe }}{% endif %}
</head>
<body>
<div class="ops-shell-app" data-page="{{ active_page }}" data-project-id="{{ project_id }}" data-env-key="{{ env_key or 'production' }}" {% if topology_id %}data-topology-id="{{ topology_id }}"{% endif %}>
  {% include '_ops_sidebar.html' %}
  <main class="ops-shell-main">
    <header class="ops-shell-topbar">
      <div class="ops-shell-breadcrumb">
        <button class="ops-shell-menu-button" type="button" aria-label="收起或展开导航"><img src="/static/project_ui/svg/global_menu.svg" alt=""></button>
        <span>项目管理</span><b>/</b><span>项目空间</span><b>/</b><strong>{{ title }}</strong>
      </div>
      <div class="ops-shell-top-actions">
        <div class="ops-context-picker">
          <button class="ops-context-trigger" type="button" data-context-trigger aria-expanded="false">
            <img src="/static/project_ui/svg/nav_project_overview.svg" alt="">
            <span>{{ project_name or project_id or '选择项目' }}</span>
            <img class="ops-context-chevron" src="/static/project_ui/svg/global_chevron_down.svg" alt="">
          </button>
          <div class="ops-context-menu" data-context-menu hidden>
            <div class="ops-context-menu-head"><strong>切换项目</strong><span>保持当前功能页面</span></div>
            <div class="ops-context-projects" data-context-projects></div>
          </div>
        </div>
        <label class="ops-shell-search">
          <img src="/static/project_ui/svg/global_search.svg" alt="">
          <input type="search" placeholder="搜索项目、文档、任务、版本、发布单...">
        </label>
        <a class="ops-shell-icon-button" href="/docs?module=projects" title="帮助中心"><img src="/static/project_ui/svg/global_help.svg" alt=""></a>
        <a class="ops-shell-icon-button" href="/admin/notifications" title="通知中心"><img src="/static/project_ui/svg/global_bell.svg" alt="">{% if unread_notification_count %}<span>{{ unread_notification_count }}</span>{% endif %}</a>
        <a class="ops-shell-profile" href="/profile"><span class="ops-shell-avatar"><img src="/static/project_ui/svg/global_user.svg" alt=""></span><span>{{ user_name or '管理员' }}</span><img class="ops-profile-chevron" src="/static/project_ui/svg/global_chevron_down.svg" alt=""></a>
      </div>
    </header>
    <section class="ops-shell-content">{{ content|safe }}</section>
  </main>
</div>
<script src="/static/ops_shell.js?v=20260623-nav1"></script>
<script>
  (function () {
    var tokenEl = document.querySelector('meta[name="csrf-token"]');
    var csrfToken = tokenEl && tokenEl.content ? tokenEl.content : '';
    if (!csrfToken || !window.fetch || window.__opsFetchCsrfPatched) return;
    var originalFetch = window.fetch.bind(window);
    window.fetch = function (resource, init) {
      init = init || {};
      var method = String(init.method || 'GET').toUpperCase();
      var target = typeof resource === 'string' ? resource : (resource && resource.url) || '';
      var isRelative = target && !/^https?:\/\//i.test(target);
      if (isRelative && ['POST', 'PUT', 'PATCH', 'DELETE'].indexOf(method) >= 0) {
        var headers = new Headers(init.headers || (resource && resource.headers) || undefined);
        if (!headers.has('X-CSRFToken')) headers.set('X-CSRFToken', csrfToken);
        init.headers = headers;
      }
      return originalFetch(resource, init);
    };
    window.__opsFetchCsrfPatched = true;
  })();
</script>
{% if extra_js %}{{ extra_js|safe }}{% endif %}
</body>
</html>
