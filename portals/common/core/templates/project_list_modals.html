<div id="createProjectModal" class="p01-modal-root delivery-dialog is-hidden" role="dialog" aria-modal="true" aria-labelledby="createProjectTitle">
  <div class="p01-modal-card p01-modal-card--create">
    <div class="p01-modal-head">
      <div class="p01-modal-head__copy">
        <h3 id="createProjectTitle">创建项目</h3>
      </div>
      <button type="button" class="p01-modal-close" data-close-modal="createProjectModal" aria-label="关闭"><img src="/static/project_ui/svg/action_close.svg" alt=""></button>
    </div>
    <form class="p01-modal-scroll" onsubmit="return false;">
      <section class="p01-modal-panel">
        <div class="p01-modal-panel__head"><h4>基础信息</h4></div>
        <div class="p01-form-grid">
          <div class="p01-field"><label for="newProjectId">项目 ID（英文）</label><input type="text" id="newProjectId" placeholder="如 MyGame" required></div>
          <div class="p01-field"><label for="newProjectName">项目名称</label><input type="text" id="newProjectName" placeholder="显示名称" required></div>
          <div class="p01-field"><label for="newProjectPhase">项目阶段</label><select id="newProjectPhase">{% for value, label in project_phases %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select></div>
          <div class="p01-field p01-field--icon">
            <label for="newProjectIconFile">项目图标</label>
            <div class="p01-icon-upload">
              <div class="p01-icon-upload__preview" id="newProjectIconPreview"><span class="p01-icon-upload__placeholder">图标</span></div>
              <div class="p01-icon-upload__body">
                <label class="pm-btn pm-btn--compact p01-icon-upload__pick" for="newProjectIconFile">选择图片</label>
                <input type="file" id="newProjectIconFile" accept="image/*" hidden>
              </div>
            </div>
            <input type="hidden" id="newProjectIcon" value="">
          </div>
          <div class="p01-field p01-span-2"><label for="newProjectIntro">简介</label><textarea id="newProjectIntro" rows="2" placeholder="一句话介绍项目用途"></textarea></div>
        </div>
      </section>
      <section class="p01-modal-panel p01-modal-panel--muted">
        <div class="p01-modal-panel__head">
          <h4>接入凭据</h4>
          <button type="button" class="pm-btn pm-btn--compact" id="btnGenerateCredentials">重新生成</button>
        </div>
        <div class="p01-form-grid">
          <div class="p01-field"><label for="newProjectGameId">gameId</label><input type="text" id="newProjectGameId" class="p01-input-readonly" readonly placeholder="打开弹窗后自动生成"></div>
          <div class="p01-field"><label for="newProjectGameKey">gameKey</label><input type="text" id="newProjectGameKey" class="p01-input-readonly" readonly placeholder="打开弹窗后自动生成"></div>
        </div>
      </section>
      <section class="p01-modal-panel">
        <div class="p01-modal-panel__head"><h4>项目成员</h4></div>
        <div class="p01-field">
          <label for="newParticipantUser">参与人员</label>
          <div class="p01-add-row">
            <input type="text" id="newParticipantUser" placeholder="输入用户名后验证添加">
            <button type="button" class="pm-btn pm-btn--primary pm-btn--compact" id="btnAddNewParticipant">验证并添加</button>
          </div>
          <ul id="newParticipantsList" class="p01-participant-list"></ul>
        </div>
      </section>
      <div id="addProjectFeedback" class="p01-feedback" aria-live="polite"></div>
    </form>
    <footer class="p01-modal-foot">
      <button type="button" class="pm-btn" data-close-modal="createProjectModal">取消</button>
      <button type="button" class="pm-btn pm-btn--primary" id="addProjectBtn">创建项目</button>
    </footer>
  </div>
</div>

<div id="channelManageModal" class="p01-modal-root delivery-dialog is-hidden" role="dialog" aria-modal="true">
  <div class="p01-modal-card">
    <div class="p01-modal-head">
      <div class="p01-modal-head__copy"><h3>渠道管理</h3></div>
      <button type="button" class="p01-modal-close" data-close-modal="channelManageModal" aria-label="关闭"><img src="/static/project_ui/svg/action_close.svg" alt=""></button>
    </div>
    <div class="p01-modal-scroll">
      <div class="p01-channel-form">
        <div class="p01-form-grid p01-form-grid--3">
          <div class="p01-field"><label>渠道 ID</label><input type="text" id="channelFormId" placeholder="如 dev / test / production"></div>
          <div class="p01-field"><label>渠道名称</label><input type="text" id="channelFormName" placeholder="如 开发版 / 测试版 / 线上版"></div>
          <div class="p01-field"><label>排序</label><input type="number" id="channelFormOrder" value="0"></div>
        </div>
        <div class="p01-form-grid">
          <div class="p01-field"><label>APK 子目录（可选）</label><input type="text" id="channelFormApkSubdir" placeholder="如 dev、test"></div>
          <div class="p01-field"><label>构建参数（可选）</label><input type="text" id="channelFormBuildParam" placeholder="如 CHANNEL=dev"></div>
        </div>
        <div class="p01-field"><label>说明（可选）</label><textarea id="channelFormDesc" rows="2" placeholder="渠道用途说明"></textarea></div>
        <div class="p01-form-actions-inline">
          <button type="button" class="pm-btn" id="btnResetChannelForm">重置</button>
          <button type="button" class="pm-btn pm-btn--primary" id="btnSubmitChannelForm">保存渠道</button>
        </div>
        <input type="hidden" id="channelFormEditingId" value="">
      </div>
      <h4 class="p01-subheading">已有渠道</h4>
      <table class="p01-mini-table">
        <thead><tr><th>ID</th><th>名称</th><th>APK 子目录</th><th>构建参数</th><th>操作</th></tr></thead>
        <tbody id="channelTableBody"></tbody>
      </table>
      <p id="channelEmptyTip" class="p01-hint p01-center is-hidden">暂无渠道，可在上方添加。</p>
    </div>
  </div>
</div>

<div id="participantRoleModal" class="p01-modal-root delivery-dialog is-hidden" role="dialog" aria-modal="true">
  <div class="p01-modal-card p01-modal-card--sm">
    <div class="p01-modal-head">
      <div class="p01-modal-head__copy"><h3>设定角色</h3><p>用户：<strong id="roleModalUsername"></strong></p></div>
      <button type="button" class="p01-modal-close" data-close-modal="participantRoleModal" aria-label="关闭"><img src="/static/project_ui/svg/action_close.svg" alt=""></button>
    </div>
    <div class="p01-modal-scroll">
      <div class="p01-field"><label for="roleModalRole">角色</label><select id="roleModalRole" class="p01-full">{% for role in project_roles %}<option value="{{ role }}">{{ role }}</option>{% endfor %}</select></div>
    </div>
    <footer class="p01-modal-foot">
      <button type="button" class="pm-btn" data-close-modal="participantRoleModal">取消</button>
      <button type="button" class="pm-btn pm-btn--primary" id="btnConfirmParticipantRole">确认</button>
    </footer>
  </div>
</div>

<div id="editProjectModal" class="p01-modal-root delivery-dialog is-hidden" role="dialog" aria-modal="true">
  <div class="p01-modal-card p01-modal-card--edit">
    <div class="p01-modal-head">
      <div class="p01-modal-head__copy">
        <h3>编辑项目</h3>
        <p>项目 ID：<strong id="editProjectIdLabel"></strong></p>
      </div>
      <button type="button" class="p01-modal-close" data-close-modal="editProjectModal" aria-label="关闭"><img src="/static/project_ui/svg/action_close.svg" alt=""></button>
    </div>
    <div class="p01-modal-scroll">
      <section class="p01-modal-panel">
        <div class="p01-modal-panel__head"><h4>基础信息</h4></div>
        <div class="p01-form-grid">
          <div class="p01-field"><label for="editProjectName">项目名称</label><input type="text" id="editProjectName"></div>
          <div class="p01-field"><label for="editProjectNameEn">英文名</label><input type="text" id="editProjectNameEn" placeholder="English name"></div>
          <div class="p01-field"><label for="editProjectPhase">项目阶段</label><select id="editProjectPhase">{% for value, label in project_phases %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select></div>
          <div class="p01-field p01-field--icon">
            <label for="editProjectIconFile">项目图标</label>
            <div class="p01-icon-upload">
              <div class="p01-icon-upload__preview" id="editProjectIconPreview"><span class="p01-icon-upload__placeholder">图标</span></div>
              <div class="p01-icon-upload__body">
                <label class="pm-btn pm-btn--compact p01-icon-upload__pick" for="editProjectIconFile">更换图片</label>
                <input type="file" id="editProjectIconFile" accept="image/*" hidden>
              </div>
            </div>
            <input type="hidden" id="editProjectIcon" value="">
          </div>
          <div class="p01-field p01-span-2"><label for="editProjectIntro">简介</label><textarea id="editProjectIntro" rows="2" placeholder="一句话介绍项目用途"></textarea></div>
        </div>
      </section>
      <section class="p01-modal-panel">
        <div class="p01-modal-panel__head"><h4>协作与渠道</h4></div>
        <div class="p01-form-grid">
          <div class="p01-field"><label for="editProjectViewers">可查看用户</label><input type="text" id="editProjectViewers" placeholder="多个用户名，逗号分隔"></div>
          <div class="p01-field">
            <label for="editParticipantUser">项目参与人员</label>
            <div class="p01-add-row">
              <input type="text" id="editParticipantUser" placeholder="输入用户名后验证添加">
              <button type="button" class="pm-btn pm-btn--primary pm-btn--compact" id="btnAddEditParticipant">验证并添加</button>
            </div>
            <ul id="editParticipantsList" class="p01-participant-list"></ul>
          </div>
        </div>
        <div class="p01-field">
          <label>可用渠道</label>
          <div id="editProjectChannels" class="p01-channel-checks"></div>
        </div>
      </section>
      <details class="p01-disclosure">
        <summary>高级 · 构建集成与其它</summary>
        <div class="p01-disclosure__body">
          <div class="p01-form-grid">
            <div class="p01-field"><label>默认 APP_NAME</label><input type="text" id="editProjectAppName"></div>
            <div class="p01-field"><label>OUTPUT_BASE_DIR（可选）</label><div class="p01-add-row"><input type="text" id="editProjectOutputBaseDir"><button type="button" class="pm-btn pm-btn--compact" data-path-picker="editProjectOutputBaseDir" data-path-mode="dir">浏览</button></div></div>
            <div class="p01-field p01-span-2"><label>Git 仓库 URL</label><input type="text" id="editProjectGitUrl"></div>
            <div class="p01-field p01-span-2"><label>Git 工作目录</label><div class="p01-add-row"><input type="text" id="editProjectGitWorkspace"><button type="button" class="pm-btn pm-btn--compact" data-path-picker="editProjectGitWorkspace" data-path-mode="dir">浏览</button></div></div>
            <div class="p01-field p01-span-2"><label>Git SSH 密钥路径（可选）</label><div class="p01-add-row"><input type="text" id="editProjectGitSshKey"><button type="button" class="pm-btn pm-btn--compact" data-path-picker="editProjectGitSshKey" data-path-mode="file">浏览</button></div></div>
            <div class="p01-field"><label>默认 Git 分支</label><input type="text" id="editProjectDefaultGitBranch"></div>
            <div class="p01-field p01-span-2"><label>Git 分支列表（每行一个）</label><textarea id="editProjectGitBranches" rows="2"></textarea></div>
            <div class="p01-field p01-span-2"><label>Unity 项目路径（可选）</label><div class="p01-add-row"><input type="text" id="editProjectUnityProjectPath"><button type="button" class="pm-btn pm-btn--compact" data-path-picker="editProjectUnityProjectPath" data-path-mode="dir">浏览</button></div></div>
            <div class="p01-field p01-span-2 p01-form-actions-inline"><button type="button" class="pm-btn pm-btn--compact" id="editProjectValidateGitBtn">验证 Git 配置</button><span id="editProjectGitValidateResult" class="p01-hint"></span></div>
          </div>
          <div class="p01-form-grid p01-form-grid--3">
            <div class="p01-field"><label>玩家官网域名</label><input type="text" id="editProjectPlayerPublicUrl" placeholder="https://game.example.com"></div>
            <div class="p01-field"><label>论坛域名</label><input type="text" id="editProjectForumPublicUrl" placeholder="https://forum.example.com"></div>
            <div class="p01-field"><label>开发后台域名</label><input type="text" id="editProjectAdminPublicUrl" placeholder="https://studio.example.com"></div>
          </div>
          <div class="p01-field"><label>详情</label><textarea id="editProjectDetail" rows="2"></textarea></div>
          <div class="p01-field"><label>网络连接说明</label><input type="text" id="editProjectNetwork"></div>
        </div>
      </details>
    </div>
    <footer class="p01-modal-foot">
      <button type="button" class="pm-btn" data-close-modal="editProjectModal">取消</button>
      <button type="button" class="pm-btn pm-btn--primary" id="btnSaveEditProject">保存更改</button>
    </footer>
  </div>
</div>

<div id="p01CardMenu" class="p01-card-menu is-hidden" role="menu"></div>
