# Wave B：多副本 BaaS + Redis + Postgres（水平扩展骨架）
# 用法：docker compose -f docker-compose.baas.scale.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: apk_baas
      POSTGRES_PASSWORD: apk_baas_dev
      POSTGRES_DB: apk_baas
    ports:
      - "5433:5432"
    volumes:
      - apk_baas_pgdata_scale:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apk_baas -d apk_baas"]
      interval: 5s
      timeout: 5s
      retries: 8
    networks: [baas_scale]

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks: [baas_scale]

  baas-portal:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "waitress", "--listen=0.0.0.0:5004", "--threads=16", "app_baas:app"]
    environment:
      BAAS_STANDALONE: "1"
      PORTAL_SERVER_FRAMEWORKS: baas
      BAAS_PORT: "5004"
      BAAS_WORKERS: "4"
      BAAS_PG_POOL: "1"
      USE_SQLITE: "false"
      DATABASE_URL: postgresql://apk_baas:apk_baas_dev@postgres:5432/apk_baas
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${BAAS_SECRET_KEY:-dev-change-me-scale}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "5004"
    networks: [baas_scale]
    deploy:
      replicas: 2

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "5004:80"
    volumes:
      - ./docs/runbooks/baas_nginx_scale.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - baas-portal
    networks: [baas_scale]

networks:
  baas_scale:
    driver: bridge

volumes:
  apk_baas_pgdata_scale:
